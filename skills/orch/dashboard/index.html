<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>orch</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div class="brand"><a href="#/">orch</a></div>
  <nav class="nav nav-tabs" aria-label="Sections">
    <a href="#/">Runs</a>
    <a href="#/profiles">Profiles</a>
    <a href="#/harnesses">Harnesses</a>
    <a href="#/memory">Memory</a>
    <a href="#/suggestions">Suggestions</a>
  </nav>
  <div class="spacer"></div>
  <div class="fresh" id="fresh" aria-live="polite"><span class="dot"></span><span id="fresh-text">waiting for data…</span></div>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch to light mode" title="Switch theme">
    <svg class="only-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
    <svg class="only-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>
<main id="main"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
