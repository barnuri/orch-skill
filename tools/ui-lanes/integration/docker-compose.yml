# Full-backend lane. The server runs against a named volume seeded with a throwaway orch home, never the live home.
# Host port defaults to 16724 (never 6724). Run: bun tools/ui-lanes/integration/run.ts
name: orch-ui-lane
services:
  orch:
    build:
      context: ../../..
      dockerfile: tools/ui-lanes/integration/Dockerfile
    ports:
      - "127.0.0.1:${ORCH_LANE_PORT:-16724}:6724"
    volumes:
      - ../../..:/app:ro
      # bun's node_modules symlink into its global cache with absolute paths; mount it at the same path
      - ${HOME}/.bun/install/cache:${HOME}/.bun/install/cache:ro
      - lane-home:/orch-home
    environment:
      HARNESS_ORCH_HOME: /orch-home
      ORCH_HERDR: "0"
      ORCH_ALLOW_REMOTE: "1"
volumes:
  lane-home:
