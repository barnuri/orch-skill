# Full-backend lane. The server reads a temp orch home that integration/run.ts seeds and bind-mounts.
# The host port is random (set by run.ts as ORCH_LANE_PORT), never 6724. Do not run this file by hand:
# run.ts sets ORCH_LANE_HOME, ORCH_LANE_PORT and COMPOSE_PROJECT_NAME.
services:
  orch:
    build:
      context: ../../..
      dockerfile: tools/ui-lanes/integration/Dockerfile
    ports:
      - "127.0.0.1:${ORCH_LANE_PORT:?set by run.ts}:6724"
    volumes:
      - ../../..:/app:ro
      # bun's node_modules symlink into its global cache with absolute paths; mount it at the same path
      - ${HOME}/.bun/install/cache:${HOME}/.bun/install/cache:ro
      - ${ORCH_LANE_HOME:?set by run.ts}:/orch-home
    environment:
      HARNESS_ORCH_HOME: /orch-home
      ORCH_HERDR: "0"
      ORCH_ALLOW_REMOTE: "1"
